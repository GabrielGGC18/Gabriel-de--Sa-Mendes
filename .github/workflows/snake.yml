name: Snake de contribuições

on:
  schedule:
    - cron: "0 */12 * * *" # a cada 12 horas
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/snake.yml"] # roda na hora quando este arquivo muda

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark&color_snake=#5eead4&color_dots=#161b22,#0e4a45,#14776d,#2bb3a0,#5eead4

      # Salva na própria main (assets/readme/), sem branch extra
      - name: Commit
        run: |
          mkdir -p assets/readme
          cp dist/snake.svg dist/snake-dark.svg assets/readme/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/readme/snake.svg assets/readme/snake-dark.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore: atualiza cobrinha de contribuições"
          git pull --rebase origin main
          git push
